[project]
name = "onshape-mcp"
version = "0.2.0"
description = "A rate-limited MCP server that lets AI assistants create and inspect Onshape CAD"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27,<1",
    "cachetools>=5.4,<7",
    # onpy's feature API is tightly coupled to this adapter; update deliberately with tests.
    "onpy==0.0.7",
]

[project.urls]
Homepage = "https://github.com/Mbvjdev/onshape-mcp"
Repository = "https://github.com/Mbvjdev/onshape-mcp"
Issues = "https://github.com/Mbvjdev/onshape-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[project.scripts]
onshape-mcp = "onshape_mcp.server:main"

[tool.setuptools.package-dir]
"onshape_mcp" = "src/onshape_mcp"

[tool.setuptools.packages.find]
where = ["src"]
